generate_device_panel_screen:
  name: Generate device panel screen
  description: >
    Render a 480x480 weather image (current conditions, a five-slot forecast
    row and a 48-hour temperature graph) and save it to
    /config/www/smhi_odp_panel.jpg, ready for a wall panel or dashboard to
    fetch. Does nothing unless "Enable device panel image export" is turned
    on in this config entry's options.
  fields:
    entry_id:
      name: Entry ID
      description: >
        Which SMHI ODP config entry to render. Defaults to one of the
        configured entries, so set this explicitly if you have more than one
        location.
      required: false
      example: "01KDTWFBR6XT3TXMX6RKWJD6YB"
      selector:
        text:
  response:
    success:
      description: Whether the render succeeded.
      example: true
    filename:
      description: The filename written under /config/www/.
      example: "smhi_odp_panel.jpg"
    size:
      description: Size of the rendered JPEG in bytes.
      example: 28000
    next_refresh_s:
      description: >
        Seconds until it is worth rendering again - just after the top of the
        next hour, when the forecast row's leading "next two hours" slots roll
        over. Useful for panels that have no clock of their own.
      example: 1320
