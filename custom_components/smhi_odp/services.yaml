generate_today_gif:
  name: Generate Today GIF
  description: Generate an animated GIF showing hourly weather forecast for today (hours 05-22).
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID (optional, uses default if not specified).
      required: false
      example: "abc123def456"
      selector:
        text:
  response:
    gif_bytes:
      description: Hex-encoded GIF image data.
      example: "474946383961..."
    size:
      description: Size of the GIF in bytes.
      example: 45000

generate_tomorrow_gif:
  name: Generate Tomorrow GIF
  description: Generate an animated GIF showing weather forecast for tomorrow in time blocks (morning, afternoon, evening).
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID (optional, uses default if not specified).
      required: false
      example: "abc123def456"
      selector:
        text:
  response:
    gif_bytes:
      description: Hex-encoded GIF image data.
      example: "474946383961..."
    size:
      description: Size of the GIF in bytes.
      example: 45000

generate_week_gif:
  name: Generate Week GIF
  description: Generate an animated GIF showing daily weather forecast for the upcoming week (days +2 to +9).
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID (optional, uses default if not specified).
      required: false
      example: "abc123def456"
      selector:
        text:
  response:
    gif_bytes:
      description: Hex-encoded GIF image data.
      example: "474946383961..."
    size:
      description: Size of the GIF in bytes.
      example: 45000

generate_today_awtrix:
  name: Generate Today AWTRIX Animation
  description: Generate AWTRIX animation frames for today's hourly weather forecast (6 hours).
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID (optional, uses default if not specified).
      required: false
      example: "01KDTWFBR6XT3TXMX6RKWJD6YB"
      selector:
        text:
  response:
    success:
      description: Whether the operation succeeded.
      example: true
    frames:
      description: Array of AWTRIX payload objects for each hour.
      example: [{"text": " 15°", "textColor": "#32FF64", "draw": [...], "duration": 5}]
    count:
      description: Number of frames generated.
      example: 6

generate_tomorrow_awtrix:
  name: Generate Tomorrow AWTRIX Animation
  description: Generate AWTRIX animation frames for tomorrow's forecast (4 time blocks).
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID (optional, uses default if not specified).
      required: false
      example: "01KDTWFBR6XT3TXMX6RKWJD6YB"
      selector:
        text:
  response:
    success:
      description: Whether the operation succeeded.
      example: true
    frames:
      description: Array of AWTRIX payload objects for each time block.
      example: [{"text": " 12°", "textColor": "#3296FF", "draw": [...], "duration": 5}]
    count:
      description: Number of frames generated.
      example: 4

generate_week_awtrix:
  name: Generate Week AWTRIX Animation
  description: Generate AWTRIX animation frames for weekly forecast (7 days).
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID (optional, uses default if not specified).
      required: false
      example: "01KDTWFBR6XT3TXMX6RKWJD6YB"
      selector:
        text:
  response:
    success:
      description: Whether the operation succeeded.
      example: true
    frames:
      description: Array of AWTRIX payload objects for each day.
      example: [{"text": " 18/10°", "textColor": "#32FF64", "draw": [...], "duration": 5}]
    count:
      description: Number of frames generated.
      example: 7
