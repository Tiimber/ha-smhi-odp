- id: 'master_weather_display'
  alias: 'AWTRIX Weather - Master Display Loop'
  description: Continuously cycles through animated weather views (today, tomorrow, week) with 20s delay between cycles
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
    # Infinite loop - cycles continuously through all weather views
    - repeat:
        while: []  # Empty condition = loop forever
        sequence:
          # Generate and parse today's GIF (250ms per frame for smooth animation)
          - service: smhi_odp.parse_gif_to_frames
            data:
              gif_name: 'weather_today.gif'
              frame_duration: 250
            response_variable: today_frames
          
          # Loop through today's frames with actual GIF timing
          - repeat:
              count: '{{ today_frames.frames | length }}'
              sequence:
                - data:
                    topic: awtrix_966f54/custom/weather
                    payload: >
                      {{ today_frames.frames[repeat.index - 1] | to_json }}
                  action: mqtt.publish
                - delay:
                    milliseconds: '{{ today_frames.frames[repeat.index - 1].frame_delay_ms }}'
          
          # Small pause before next GIF
          - delay:
              seconds: 2
          
          # Generate and parse tomorrow's GIF (250ms per frame)
          - service: smhi_odp.parse_gif_to_frames
            data:
              gif_name: 'weather_tomorrow.gif'
              frame_duration: 250
            response_variable: tomorrow_frames
          
          # Loop through tomorrow's frames with actual GIF timing
          - repeat:
              count: '{{ tomorrow_frames.frames | length }}'
              sequence:
                - data:
                    topic: awtrix_966f54/custom/weather
                    payload: >
                      {{ tomorrow_frames.frames[repeat.index - 1] | to_json }}
                  action: mqtt.publish
                - delay:
                    milliseconds: '{{ tomorrow_frames.frames[repeat.index - 1].frame_delay_ms }}'
          
          # Small pause before next GIF
          - delay:
              seconds: 2
          
          # Generate and parse week's GIF (250ms per frame)
          - service: smhi_odp.parse_gif_to_frames
            data:
              gif_name: 'weather_week.gif'
              frame_duration: 250
            response_variable: week_frames
          
          # Loop through week's frames with actual GIF timing
          - repeat:
              count: '{{ week_frames.frames | length }}'
              sequence:
                - data:
                    topic: awtrix_966f54/custom/weather
                    payload: >
                      {{ week_frames.frames[repeat.index - 1] | to_json }}
                  action: mqtt.publish
                - delay:
                    milliseconds: '{{ week_frames.frames[repeat.index - 1].frame_delay_ms }}'
          
          # 20-second delay before repeating the cycle (placeholder for future clock display)
          - delay:
              seconds: 20
  mode: single
