- id: 'master_weather_display'
  alias: 'AWTRIX Weather - Master Display Loop'
  description: Cycles through animated weather views (today, tomorrow, week) using actual GIF frames
  triggers:
  - minutes: /20
    trigger: time_pattern
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
    # Generate and parse today's GIF
    - service: smhi_odp.parse_gif_to_frames
      data:
        gif_name: 'weather_today.gif'
        frame_duration: 4
      response_variable: today_frames
    
    # Loop through today's frames
    - repeat:
        count: '{{ today_frames.frames | length }}'
        sequence:
          - data:
              topic: awtrix_966f54/custom/weather
              payload: >
                {{ today_frames.frames[repeat.index - 1] | to_json }}
            action: mqtt.publish
          - delay:
              seconds: 4
    
    # Small pause before next GIF
    - delay:
        seconds: 2
    
    # Generate and parse tomorrow's GIF
    - service: smhi_odp.parse_gif_to_frames
      data:
        gif_name: 'weather_tomorrow.gif'
        frame_duration: 5
      response_variable: tomorrow_frames
    
    # Loop through tomorrow's frames
    - repeat:
        count: '{{ tomorrow_frames.frames | length }}'
        sequence:
          - data:
              topic: awtrix_966f54/custom/weather
              payload: >
                {{ tomorrow_frames.frames[repeat.index - 1] | to_json }}
            action: mqtt.publish
          - delay:
              seconds: 5
    
    # Small pause before next GIF
    - delay:
        seconds: 2
    
    # Generate and parse week's GIF
    - service: smhi_odp.parse_gif_to_frames
      data:
        gif_name: 'weather_week.gif'
        frame_duration: 5
      response_variable: week_frames
    
    # Loop through week's frames
    - repeat:
        count: '{{ week_frames.frames | length }}'
        sequence:
          - data:
              topic: awtrix_966f54/custom/weather
              payload: >
                {{ week_frames.frames[repeat.index - 1] | to_json }}
            action: mqtt.publish
          - delay:
              seconds: 5
    
    # Final pause before loop restarts (20s total wait)
    - delay:
        seconds: 15
  mode: single
